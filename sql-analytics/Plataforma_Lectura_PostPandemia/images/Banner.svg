<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FFCC70"/>
    </linearGradient>
    <linearGradient id="bookA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E94560"/>
      <stop offset="100%" stop-color="#B82C45"/>
    </linearGradient>
    <linearGradient id="bookB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#E89C2C"/>
    </linearGradient>
    <linearGradient id="bookC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#2A9D96"/>
    </linearGradient>
    <linearGradient id="bookD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A29BFE"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
    <linearGradient id="bookE" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#C9356C"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Decorative grid pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- SQL code snippet decoration (background, faded) -->
  <g opacity="0.12" font-family="Courier New, monospace" font-size="14" fill="#4ECDC4">
    <text x="50" y="40">SELECT title, AVG(rating)</text>
    <text x="50" y="60">FROM books JOIN ratings</text>
    <text x="50" y="370">GROUP BY publisher</text>
    <text x="50" y="390">ORDER BY total DESC;</text>
  </g>

  <!-- Books illustration (left side) -->
  <g transform="translate(80, 180)">
    <!-- Shelf line -->
    <rect x="-10" y="160" width="280" height="4" fill="#FFB347" opacity="0.6"/>

    <!-- Book A (red, tallest) -->
    <rect x="20" y="20" width="32" height="140" rx="2" fill="url(#bookA)"/>
    <rect x="20" y="40" width="32" height="3" fill="#FFFFFF" opacity="0.4"/>
    <rect x="20" y="135" width="32" height="3" fill="#FFFFFF" opacity="0.4"/>
    <text x="36" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#FFFFFF" font-weight="bold" transform="rotate(-90, 36, 100)">SQL</text>

    <!-- Book B (orange) -->
    <rect x="58" y="40" width="28" height="120" rx="2" fill="url(#bookB)"/>
    <rect x="58" y="55" width="28" height="2" fill="#FFFFFF" opacity="0.4"/>
    <rect x="58" y="140" width="28" height="2" fill="#FFFFFF" opacity="0.4"/>

    <!-- Book C (teal) -->
    <rect x="92" y="50" width="34" height="110" rx="2" fill="url(#bookC)"/>
    <rect x="92" y="65" width="34" height="2" fill="#FFFFFF" opacity="0.4"/>
    <rect x="92" y="142" width="34" height="2" fill="#FFFFFF" opacity="0.4"/>
    <text x="109" y="115" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#FFFFFF" font-weight="bold" transform="rotate(-90, 109, 115)">DATA</text>

    <!-- Book D (purple, slightly tilted) -->
    <g transform="translate(132, 30) rotate(3)">
      <rect x="0" y="0" width="30" height="130" rx="2" fill="url(#bookD)"/>
      <rect x="0" y="15" width="30" height="2" fill="#FFFFFF" opacity="0.4"/>
      <rect x="0" y="113" width="30" height="2" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <!-- Book E (pink, lying flat on top) -->
    <g transform="translate(170, 145)">
      <rect x="0" y="0" width="80" height="18" rx="2" fill="url(#bookE)"/>
      <rect x="0" y="3" width="80" height="2" fill="#FFFFFF" opacity="0.4"/>
      <rect x="0" y="13" width="80" height="2" fill="#FFFFFF" opacity="0.4"/>
    </g>

    <!-- Open book on top -->
    <g transform="translate(165, 80)">
      <path d="M 0 60 L 0 10 Q 0 5 5 5 L 45 5 L 45 60 Z" fill="#F5F5F5"/>
      <path d="M 45 5 L 85 5 Q 90 5 90 10 L 90 60 L 45 60 Z" fill="#FFFFFF"/>
      <line x1="45" y1="5" x2="45" y2="60" stroke="#888" stroke-width="1"/>
      <line x1="8" y1="18" x2="40" y2="18" stroke="#666" stroke-width="0.8"/>
      <line x1="8" y1="25" x2="40" y2="25" stroke="#666" stroke-width="0.8"/>
      <line x1="8" y1="32" x2="40" y2="32" stroke="#666" stroke-width="0.8"/>
      <line x1="8" y1="39" x2="35" y2="39" stroke="#666" stroke-width="0.8"/>
      <line x1="8" y1="46" x2="40" y2="46" stroke="#666" stroke-width="0.8"/>
      <line x1="50" y1="18" x2="82" y2="18" stroke="#666" stroke-width="0.8"/>
      <line x1="50" y1="25" x2="82" y2="25" stroke="#666" stroke-width="0.8"/>
      <line x1="50" y1="32" x2="82" y2="32" stroke="#666" stroke-width="0.8"/>
      <line x1="50" y1="39" x2="78" y2="39" stroke="#666" stroke-width="0.8"/>
      <line x1="50" y1="46" x2="82" y2="46" stroke="#666" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Database icon (right side) -->
  <g transform="translate(960, 110)">
    <ellipse cx="80" cy="20" rx="70" ry="18" fill="#4ECDC4" opacity="0.95"/>
    <path d="M 10 20 L 10 60 Q 10 78 80 78 Q 150 78 150 60 L 150 20" fill="#3BAFA8"/>
    <ellipse cx="80" cy="20" rx="70" ry="18" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="80" cy="60" rx="70" ry="18" fill="#4ECDC4" opacity="0.95"/>
    <path d="M 10 60 L 10 100 Q 10 118 80 118 Q 150 118 150 100 L 150 60" fill="#3BAFA8"/>
    <ellipse cx="80" cy="60" rx="70" ry="18" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="80" cy="100" rx="70" ry="18" fill="#4ECDC4" opacity="0.95"/>
    <path d="M 10 100 L 10 140 Q 10 158 80 158 Q 150 158 150 140 L 150 100" fill="#3BAFA8"/>
    <ellipse cx="80" cy="140" rx="70" ry="18" fill="#4ECDC4"/>
    <ellipse cx="80" cy="140" rx="70" ry="18" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.5"/>

    <ellipse cx="80" cy="20" rx="70" ry="18" fill="url(#accent)" opacity="0.15"/>

    <text x="80" y="90" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="bold" fill="#FFFFFF" filter="url(#glow)">SQL</text>
  </g>

  <!-- Connecting "data flow" dots between books and database -->
  <g fill="#FFB347" opacity="0.7">
    <circle cx="380" cy="200" r="3"/>
    <circle cx="430" cy="200" r="3"/>
    <circle cx="480" cy="200" r="3"/>
    <circle cx="900" cy="200" r="3"/>
    <circle cx="930" cy="200" r="3"/>
  </g>

  <!-- Main title -->
  <g transform="translate(600, 175)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#FFFFFF">Análisis SQL</text>
    <text x="0" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="url(#accent)" font-weight="600" letter-spacing="2">PLATAFORMA DE LECTURA POST-PANDEMIA</text>

    <rect x="-90" y="55" width="180" height="3" fill="url(#accent)" rx="1.5"/>

    <text x="0" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#B8C5D6" letter-spacing="1.5">
      <tspan>BOOKS</tspan>
      <tspan dx="14" fill="#FFB347">·</tspan>
      <tspan dx="14">RATINGS</tspan>
      <tspan dx="14" fill="#FFB347">·</tspan>
      <tspan dx="14">REVIEWS</tspan>
      <tspan dx="14" fill="#FFB347">·</tspan>
      <tspan dx="14">PUBLISHERS</tspan>
      <tspan dx="14" fill="#FFB347">·</tspan>
      <tspan dx="14">AUTHORS</tspan>
    </text>
  </g>

  <!-- Author tag -->
  <text x="600" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7A8FA8" letter-spacing="2">CAROLINA RODRÍGUEZ GUERRA  ·  DATA ANALYST PORTFOLIO</text>
</svg>
